      - name: Configure CMake (generate)
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          $cmakeToolchain = Join-Path $env:VCPKG_ROOT 'scripts\buildsystems\vcpkg.cmake'
          $buildType = $env:BUILD_TYPE
          Write-Host "Using vcpkg toolchain: $cmakeToolchain"
          Write-Host "Build type: $buildType"
          # Explicit generator + architecture and point CMake at vcpkg toolchain file.
          # Use PowerShell env vars ($env:...) instead of GitHub expressions inside the script.
          cmake -S "Source" -B "build" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE="$buildType" `
            -DCMAKE_TOOLCHAIN_FILE="$cmakeToolchain" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DBUILD_SHARED_LIBS=OFF `
            -DDOLPHIN_ENABLE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { Write-Error "CMake configure failed"; exit 1 }

      - name: Build (Release)
        shell: pwsh
        run: |
          # Build the Release configuration for multi-config generators (Visual Studio)
          cmake --build "build" --config Release --target ALL_BUILD -- /m
          if ($LASTEXITCODE -ne 0) { Write-Error "Build failed"; exit 1 }
