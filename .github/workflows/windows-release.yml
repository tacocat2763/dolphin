# Build + package Dolphin on Windows x64 and create a release.
# - Installs vcpkg and selected ports
# - Configures CMake with vcpkg toolchain
# - Builds Release, packages output into a zip
# - Creates a GitHub release & uploads the zip
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build_windows:
    name: Build and package (Windows x64)
    runs-on: windows-2025-vs2026

    env:
      BUILD_TYPE: Release
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: List the two edited files (sanity)
      shell: pwsh
      run: |
        $p = Join-Path $PWD 'Source\Core\InputCommon\ControllerInterface'
        if (Test-Path $p) {
          Get-ChildItem -Path $p -Filter 'DualShockUDPClient*' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Directory not found: $p"
        }
        Write-Host "Ensure your two edited files are committed; the workflow builds whatever is checked in."

    - name: Clone and bootstrap vcpkg
      shell: pwsh
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg integrate install
        Write-Host "vcpkg root: $PWD\vcpkg"
        Write-Host "CMake toolchain for vcpkg is: $PWD\vcpkg\scripts\buildsystems\vcpkg.cmake"

    - name: Install vcpkg ports (explicit args — avoids PowerShell single-arg bug)
      shell: pwsh
      run: |
        # IMPORTANT: pass packages as separate argv items so vcpkg parses them individually
        .\vcpkg\vcpkg.exe install --triplet x64-windows fmt sqlite3 zlib libpng libjpeg-turbo glew

    - name: Show vcpkg list (diagnostic)
      shell: pwsh
      run: .\vcpkg\vcpkg.exe list

    - name: Configure CMake (try Ninja, fallback to Visual Studio)
      shell: pwsh
      run: |
        $toolchain = Join-Path $env:GITHUB_WORKSPACE 'vcpkg\scripts\buildsystems\vcpkg.cmake'
        $buildDir = Join-Path $PWD 'build'
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $buildDir
        New-Item -ItemType Directory -Path $buildDir | Out-Null

        Write-Host "Running CMake configure with Ninja..."
        $cmakeArgs = @(
          '-S', $PWD,
          '-B', $buildDir,
          '-A', 'x64',
          "-DCMAKE_BUILD_TYPE=${env:BUILD_TYPE}",
          "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
          '-G', 'Ninja'
        )

        $ok = $false
        try {
          & cmake @cmakeArgs | Tee-Object -Variable cmout
          if ($LASTEXITCODE -eq 0) { $ok = $true }
        } catch {
          Write-Host "Ninja configure failed, will try Visual Studio generator..."
        }

        if (-not $ok) {
          Write-Host "Retrying CMake configure with Visual Studio 17 2022 generator..."
          $cmakeArgs[-1] = 'Visual Studio 17 2022'  # replace 'Ninja' with VS generator
          $cmakeArgs += ('-T','host=x64') # optional
          & cmake @cmakeArgs | Tee-Object -Variable cmout2
          if ($LASTEXITCODE -ne 0) {
            Write-Output "CMake configure output (Ninja + VS attempts):"
            $cmout
            $cmout2
            exit 1
          }
        }

    - name: Build (Release)
      shell: pwsh
      run: |
        $buildDir = Join-Path $PWD 'build'
        # Use cmake --build; if multi-config (VS), pass --config Release
        cmake --build $buildDir --config Release -- /m

    - name: Collect build output and package
      shell: pwsh
      run: |
        $outdir = Join-Path $PWD 'artifacts'
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $outdir
        New-Item -ItemType Directory -Path $outdir | Out-Null

        # Adjust paths below if the real product binaries are in a different build output path.
        $candidatePaths = @(
          Join-Path $PWD 'build\bin\Release\*',
          Join-Path $PWD 'build\bin\*',
          Join-Path $PWD 'build\Release\*',
          Join-Path $PWD 'build\*'
        )

        $found = $false
        foreach ($p in $candidatePaths) {
          if (Get-ChildItem -Path $p -ErrorAction SilentlyContinue) {
            Write-Host "Including: $p"
            Compress-Archive -Path $p -DestinationPath (Join-Path $outdir 'Dolphin-Windows-x64.zip') -Force
            $found = $true
            break
          }
        }
        if (-not $found) {
          Write-Host "Warning: couldn't find expected build outputs. Packaging entire repo as fallback."
          Compress-Archive -Path (Join-Path $PWD '*') -DestinationPath (Join-Path $outdir 'Dolphin-Windows-x64.zip') -Force
        }
        Write-Host "artifact=" + (Join-Path $outdir 'Dolphin-Windows-x64.zip')

    - name: Upload artifact (build archive)
      uses: actions/upload-artifact@v4
      with:
        name: dolphin-windows-x64
        path: artifacts/Dolphin-Windows-x64.zip

    - name: Create GitHub release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref == 'refs/heads/master' && 'release-' + github.sha || 'manual-' + github.run_id }}
        name: "Dolphin Windows x64 build ${{ github.sha }}"
        body: |
          Automated build from ${{ github.sha }} (branch: ${{ github.ref }}) — build_type: ${{ env.BUILD_TYPE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build zip to release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/Dolphin-Windows-x64.zip
        asset_name: Dolphin-Windows-x64.zip
        asset_content_type: application/zip

    - name: Final status
      shell: pwsh
      run: Write-Host "Workflow finished. If build failed, inspect vcpkg and CMake logs above."
