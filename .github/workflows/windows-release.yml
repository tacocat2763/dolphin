name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build_windows:
    name: Build and package (Windows x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Confirm edited DualShockUDPClient files are present
        shell: pwsh
        run: |
          Write-Host "Listing files in Source/Core/InputCommon/ControllerInterface/DualShockUDPClient* (if present)"
          $p = Join-Path $PWD 'Source\Core\InputCommon\ControllerInterface'
          if (Test-Path $p) {
            Get-ChildItem -Path $p -Filter 'DualShockUDPClient*' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "Directory not found: $p"
          }
          Write-Host "Ensure your two edited files are committed; the workflow will build whatever is in the repo."

      - name: Install vcpkg (for consistent dependencies)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          & .\vcpkg\bootstrap-vcpkg.bat
          & .\vcpkg\vcpkg integrate install

      - name: Install common dependencies via vcpkg (explicit triplet)
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install --triplet x64-windows fmt sqlite3 zlib libpng libjpeg-turbo glew

      - name: Configure & build (robust env lookup, vcvars if needed, then Ninja)
        shell: pwsh
        run: |
          $buildType = $env:BUILD_TYPE

          # Safely read environment variables
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $pf    = [Environment]::GetEnvironmentVariable('ProgramFiles')

          # Candidate locations for vswhere.exe
          $candidates = @()
          if (-not [string]::IsNullOrEmpty($pf86)) {
            $candidates += Join-Path $pf86 'Microsoft Visual Studio\Installer\vswhere.exe'
            $candidates += Join-Path $pf86 'Microsoft Visual Studio\2022\BuildTools\Installer\vswhere.exe'
          }
          if (-not [string]::IsNullOrEmpty($pf)) {
            $candidates += Join-Path $pf 'Microsoft Visual Studio\Installer\vswhere.exe'
            $candidates += Join-Path $pf 'Microsoft Visual Studio\2022\BuildTools\Installer\vswhere.exe'
          }
          $candidates += 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $candidates += 'C:\Program Files\Microsoft Visual Studio\Installer\vswhere.exe'
          $candidates += 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Installer\vswhere.exe'

          $vswhere = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($vswhere) {
            Write-Host "Found vswhere at: $vswhere"
            try {
              $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            } catch {
              Write-Warning "vswhere invocation failed: $_"
              $vsInstall = $null
            }
          } else {
            Write-Warning "vswhere.exe was not found in standard locations."
            $vsInstall = $null
          }

          if (-not $vsInstall) {
            $fallback = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools'
            if (Test-Path $fallback) {
              Write-Host "Falling back to $fallback"
              $vsInstall = $fallback
            }
          }

          # If cl.exe is already available, skip vcvars
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) {
            Write-Host "cl.exe already on PATH: $($cl.Path). Skipping vcvars."
            $useVcvars = $false
          } else {
            $useVcvars = $true
          }

          if ($useVcvars -and -not $vsInstall) {
            Write-Error "Visual Studio / Build Tools not found and cl.exe not on PATH. Cannot configure MSVC environment."
            exit 1
          }

          if ($useVcvars) {
            $vcvars = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path $vcvars)) {
              Write-Error "vcvars64.bat not found at expected location: $vcvars"
              exit 1
            }
          }

          $cmakeToolchain = (Join-Path $PWD 'vcpkg\scripts\buildsystems\vcpkg.cmake') -replace '"','\"'

          # Build commands executed under cmd.exe so vcvars persists for subsequent commands
          $cmakeCmd = "cmake -S . -B build -G `"Ninja`" -DCMAKE_TOOLCHAIN_FILE=`"$cmakeToolchain`" -DCMAKE_CXX_STANDARD=17 -DDOLPHIN_BUILD_TESTS=OFF -DUNICODE=ON -Wdev -DCMAKE_POLICY_DEFAULT_CMP0074=NEW"
          $buildCmd = "cmake --build build --config $buildType -- /m"

          if ($useVcvars) {
            $vcvarsEsc = $vcvars -replace '"','\"'
            $full = "call `"$vcvarsEsc`" && if exist build rd /s /q build && $cmakeCmd && $buildCmd"
          } else {
            $full = "if exist build rd /s /q build && $cmakeCmd && $buildCmd"
          }

          Write-Host "Running build in cmd.exe..."
          Write-Host $full
          cmd.exe /c $full
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build command failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: (Optional) Run tests if available
        if: success()
        shell: pwsh
        run: |
          if (Test-Path build\CTestTestfile.cmake) {
            ctest --test-dir build --output-on-failure -C $env:BUILD_TYPE
          } else {
            Write-Host "No tests detected (no CTestTestfile). Skipping."
          }

      - name: Package build outputs
        id: package
        shell: pwsh
        run: |
          $outdir = Join-Path $PWD 'release'
          if (Test-Path $outdir) { Remove-Item -Recurse -Force $outdir }
          New-Item -ItemType Directory -Path $outdir | Out-Null

          # Use explicit string paths built from $PWD to avoid Join-Path array/type issues
          $possibleBins = @(
            "$PWD\build\bin\Release\*",
            "$PWD\build\bin\*",
            "$PWD\build\*"
          )

          $found = $false
          foreach ($p in $possibleBins) {
            try {
              Copy-Item -Path $p -Destination $outdir -Recurse -Force -ErrorAction Stop
              $found = $true
            } catch {
              # ignore missing patterns
            }
          }
          if (-not $found) {
            # Fallback: copy entire build folder if nothing matched
            Copy-Item -Path (Join-Path $PWD 'build') -Destination $outdir -Recurse -Force
          }

          $tag = '${{ github.ref_name }}'
          if (-not $tag) { $tag = 'run-' + $env:GITHUB_RUN_ID }
          $zipName = "dolphin-$tag-windows-x64.zip"
          Compress-Archive -Path (Join-Path $outdir '*') -DestinationPath $zipName -Force
          Write-Host "zip=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Automated Windows build (generated by workflow)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.zip }}
          asset_name: ${{ env.zip }}
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
