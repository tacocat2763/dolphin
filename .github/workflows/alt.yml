# Windows build + release workflow for tacocat2763/dolphin (OPTIMIZED ALT VERSION)
# - Builds Dolphin on Windows x64 using CMake + vcpkg
# - Avoids the PowerShell/vcpkg package-splitting bug by installing packages one-by-one
# - Uses vcpkg toolchain file when configuring CMake
# - Creates a GitHub release and uploads the produced ZIP artifact
# - Uses GitHub Actions binary cache for faster vcpkg builds
# Trigger: push to master, push tags, or manual workflow_dispatch
on:
  push:
    branches: [ "master" ]
    tags:
      - "release-*"
  workflow_dispatch: {}

concurrency:
  group: dolphin-windows-release-alt
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VCPKG_TRIPLET: x64-windows
  # Release tag uses master pushes or manual run id if not master
  RELEASE_TAG: ${{ github.ref == 'refs/heads/master' && format('release-{0}', github.sha) || format('manual-{0}', github.run_id) }}

jobs:
  build-and-release-windows:
    name: Build and package (Windows x64)
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout repository (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

